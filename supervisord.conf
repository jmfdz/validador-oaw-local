[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:renderer]
command=/usr/local/bin/node /opt/oaw/renderer/server.js
directory=/opt/oaw/renderer
user=node
environment=HOME="/home/node",NODE_OPTIONS="--dns-result-order=ipv4first"
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:proxy]
command=/usr/local/bin/node /opt/oaw/proxy/index.js
directory=/opt/oaw/proxy
environment=TLS_CERT="/opt/oaw/tls/proxy.crt",TLS_KEY="/opt/oaw/tls/proxy.key",RENDERER_URL="http://127.0.0.1:3000"
priority=20
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tomcat]
command=/usr/local/tomcat/bin/catalina.sh run
directory=/usr/local/tomcat
environment=JAVA_OPTS="-Djava.awt.headless=true -Dhttp.agent=Mozilla/5.0 -DEXTERNAL_PROPERTIES_PATH=/opt/oaw/config/external.properties"
priority=30
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
